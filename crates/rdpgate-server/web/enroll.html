<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RDP Gate · Add a passkey</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body data-page="enroll">
<main class="card">
  <p class="eyebrow">RDP Gate</p>
  <h1>Add a passkey</h1>
  <p>This passkey will be able to sign you in and open Remote Desktop for your network. You will confirm with Touch ID, Face ID, Windows Hello or a security key.</p>
  <label for="name">Passkey name</label>
  <input id="name" maxlength="32" autocomplete="off" spellcheck="false" placeholder="e.g. macbook-touchid">
  <button id="go" type="button">Create passkey</button>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script src="static/app.js"></script>
</body>
</html>
