[package]
name = "rdpgate-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
getrandom = "0.4.3"
hex = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
igd-next = { version = "0.18.0", default-features = false, features = ["io_sync"] }
qrcode = "0.14.1"
rcgen = "0.14.10"
rdpgate-core = { path = "../rdpgate-core" }
rpassword = "7.5.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = "1.15.1"
rustls-webpki = "0.103.16"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = "0.6.5"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "signal", "sync", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
webauthn-rs = "=0.6.1-dev"
zeroize = "1.9.1"

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
ed25519-dalek = "3.0.0"
rdpgate-client = { path = "../rdpgate-client" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
url = "2.5.8"
webauthn-authenticator-rs = { version = "=0.6.1-dev", features = ["softpasskey"] }
