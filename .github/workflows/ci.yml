name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        shell: bash
        # The desktop app needs a windowing system; Linux CI checks everything else.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then EXCLUDE="--exclude rdpgate-app"; fi
          cargo test --workspace $EXCLUDE
      - name: Clippy
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then EXCLUDE="--exclude rdpgate-app"; fi
          cargo clippy --workspace $EXCLUDE --all-targets -- -D warnings
      - name: Compile the Setup installers (smoke test)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory stage | Out-Null
          'placeholder' | Set-Content stage/rdpgate-server.exe
          'placeholder' | Set-Content stage/rdpgate.exe
          'placeholder' | Set-Content "stage/RDP Gate.exe"
          'placeholder' | Set-Content "stage/RDP Gate Server.exe"
          'placeholder' | Set-Content stage/rdpgate-tray.exe
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          foreach ($iss in 'server', 'client') {
            & $iscc /Q /DAppVersion=0.0.0 "/DSourceDir=$pwd\stage" "/DOutputDir=$pwd\iss-out" "packaging\windows\$iss.iss"
            if ($LASTEXITCODE) { exit 1 }
          }
          Get-ChildItem iss-out
      - name: Parse PowerShell installer scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem packaging/windows/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=$($f.Name)::$($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
